# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

os:
  editPreset: "nvim-remote"
  # lazygit sources this before every shell command: the `:` prompt, custom
  # commands, and editor open. zsh expands functions there but not aliases, so
  # this points at a dedicated file instead of ~/.zshrc.
  shellFunctionsFile: ~/.config/zsh/lazygit-functions.zsh

gui:
  scrollHeight: 10
  authorColors:
    'Shaked Hagag': cyan
    '*': magenta
  showFileTree: true
  skipRewordInEditorWarning: true
  showCommandLog: false
  # Ghostty and Zed's terminal are both on IoskeleyMonoTerm Nerd Font.
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  # Match the --date=iso forced in branchLogCmd / allBranchesLogCmds below.
  timeFormat: "2006-01-02"
  shortTimeFormat: "15:04"
  branchColorPatterns:
    '^(task)/': '#4BADE8'                  # Jira work branches
    '^(bugfix)/': '#F15B50'                        # conventional, changes behaviour
    '^(feature)/': '#6A9A22'    # conventional, housekeeping
git:
  mainBranches:
    - main
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=iso --pretty=medium {{branchName}} --
  allBranchesLogCmds:
    - git log --all --graph --color=always --abbrev-commit --decorate --date=iso --pretty=medium
  diffRenderers:
    # These omit --no-gitconfig on purpose, so they inherit [delta] from
    # ~/.gitconfig: dark, navigate, line-numbers, hyperlinks,
    # syntax-theme = TwoDark, tabs = 4. Everything below is a lazygit-only
    # override.
    #   --paging=never             lazygit is the pager
    #   --dark                     delta's background auto-detect misfires
    #                              under lazygit; its docs say to set this
    #   --hunk-header-style=omit   lazygit already shows file and position
    #   --hyperlinks-file-link-format  lazygit-edit:// resolves only inside
    #                              lazygit, so gitconfig must not carry it
    #   --side-by-side             one renderer only; delta cannot negate a
    #                              boolean per run, so gitconfig cannot hold it
    - name: delta-side-by-side
      command: 'delta --paging=never --dark --hunk-header-style=omit --file-modified-label="" --side-by-side --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
    - name: delta
      command: 'delta --paging=never --dark --hunk-header-style=omit --file-modified-label="" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
    # Syntax-aware structural diff for code. Unlike delta, difftastic takes
    # over diff generation rather than formatting Git's line-based output.
    - name: difftastic
      type: extDiff
      command: 'difft --color=always --context={{diffContext}}'
    # Needs no extra binary. Word-level diffs, good for markdown prose and
    # single-token renames. Cycle to it with `|`.
    - type: rawGit
      args: [--color-words]
      name: color-words
  autoFetch: false
  overrideGpg: true
# herdr creates worktrees under ~/worktrees as <repo>/<branch-slug>, set by
# [worktrees].directory in ~/.config/herdr/config.toml. This only supplies the
# candidate parent directory when you create one from lazygit with `w`, which
# skips herdr's workspace registration.
worktree:
  defaultPath: ~/worktrees
update:
  method: never
notARepository: 'quit'
promptToReturnFromSubprocess: false
disableStartupPopups: true
keybinding:
  files:
    toggleStagedAll: <disabled>

customCommands:
  - key: '<c-n>'
    description: 'New branch'
    context: 'localBranches'
    prompts:
      - type: 'menu'
        key: 'Type'
        title: 'Branch type'
        options:
          - name: 'feature'
            description: 'Jira ticket branch (work)'
            value: 'feature'
            key: 'f'
          - name: 'task'
            description: 'Jira ticket branch (work)'
            value: 'task'
            key: 't'
          - name: 'bugfix'
            description: 'Jira ticket branch (work)'
            value: 'bugfix'
            key: 'b'
          - name: 'feat'
            description: 'conventional: new feature'
            value: 'feat'
            key: 'F'
          - name: 'fix'
            description: 'conventional: bug fix'
            value: 'fix'
            key: 'x'
          - name: 'chore'
            description: 'conventional: maintenance, deps'
            value: 'chore'
            key: 'c'
          - name: 'docs'
            description: 'conventional: documentation'
            value: 'docs'
            key: 'd'
          - name: 'refactor'
            description: 'conventional: no behaviour change'
            value: 'refactor'
            key: 'r'
          - name: 'test'
            description: 'conventional: tests only'
            value: 'test'
            key: 's'
          - name: 'perf'
            description: 'conventional: performance'
            value: 'perf'
            key: 'p'
          - name: 'ci'
            description: 'conventional: pipelines, workflows'
            value: 'ci'
            key: 'i'
          - name: 'build'
            description: 'conventional: build system'
            value: 'build'
            key: 'u'
      - type: 'input'
        key: 'Ticket'
        title: 'Ticket number'
        initialValue: 'frm-'
        condition: '{{ or (eq .Form.Type "feature") (eq .Form.Type "task") (eq .Form.Type "bugfix") }}'
      - type: 'input'
        key: 'Desc'
        title: 'Short description'
        condition: '{{ not (or (eq .Form.Type "feature") (eq .Form.Type "task") (eq .Form.Type "bugfix")) }}'
    command: "git checkout -b \"{{.Form.Type}}/$(printf '%s' '{{.Form.Ticket}}{{.Form.Desc}}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')\" \"{{.SelectedLocalBranch.Name}}\""
    loadingText: 'Creating branch'

  # Model choice for the pi commands below.
  #
  # Median wall time on an identical commit-message task, 3 runs each,
  # --thinking low, no tools:
  #   github-copilot/gpt-5.4-mini        2.2s  <- primary
  #   github-copilot/mai-code-1.1-flash  3.4s
  #   openai-codex/gpt-5.3-codex-spark   4.3s  returned empty output, unusable
  #   github-copilot/claude-haiku-4.5    5.6s  previous primary
  #   openai-codex/gpt-5.4-mini          6.8s  <- fallback
  #
  # The fallback after `||` uses a different provider rather than the next
  # fastest model. It runs only when the primary fails on auth, a rate limit, or
  # a Copilot outage, and a second github-copilot entry would fail alongside it.
  # Those 6.8s cost nothing on the normal path.
  #
  # --model bypasses the `enabledModels` allowlist in ~/.pi/agent/settings.json,
  # so these run without being listed there.
  - key: '<c-c>'
    command: "GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model github-copilot/gpt-5.4-mini --thinking low '/commit' || GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model openai-codex/gpt-5.4-mini --thinking low '/commit'"
    context: 'files'
    description: 'AI commit with pi'
    loadingText: 'Generating commit...'
    output: popup
    outputTitle: 'pi commit'

  - key: '<c-a>'
    command: "GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model github-copilot/gpt-5.4-mini --thinking low '/atomic-commit' || GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model openai-codex/gpt-5.4-mini --thinking low '/atomic-commit'"
    context: 'files'
    description: 'AI atomic commits with pi'
    loadingText: 'Generating atomic commits...'
    output: popup
    outputTitle: 'pi atomic commits'

  # This was <c-o>, which is universal.copyToClipboard. Binding it here shadowed
  # copyToClipboard in the two panels that need it, for copyFileInfoToClipboard
  # and copyPullRequestURL. <ctrl+g> is unbound in every default context.
  - key: '<c-g>'
    command: "GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat GH_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model github-copilot/gpt-5.4-mini --thinking low '/create-pr {{index .PromptResponses 0}}' || GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat GH_PAGER=cat pi -p --no-session -ne -ns -xt edit,write --model openai-codex/gpt-5.4-mini --thinking low '/create-pr {{index .PromptResponses 0}}'"
    context: 'localBranches, files'
    description: 'AI create PR with pi'
    prompts:
      - type: 'input'
        title: 'Extra context for the PR (optional)'
        initialValue: ''
    loadingText: 'Creating pull request...'
    output: popup
    outputTitle: 'pi create PR'
