add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$all"""
command_timeout = 5000

[directory]
# Render full ~/ paths (not repo-relative) so substitutions match
truncate_to_repo = false
truncation_length = 6

[character]
success_symbol = '[➜](bold green)'

[directory.substitutions]
# Order matters. Substitutions are literal, no regex, and starship applies them
# in the order written, so each one can match an earlier one's output. List the
# longest prefix first or a shorter rule eats it.
#   '~/frame' before '~/frame-infra'  -> "frm-infra" instead of "infr"
#   '~/worktrees' before '~/worktrees/frame' -> "wt/frame/..." instead of "wt/..."
'~/frame-infra' = 'infr'
'~/frame' = 'frm'
# herdr lays worktrees out as ~/worktrees/<repo>/<slug>/<repo>, so the repo name
# appears twice. Collapsing the prefix through the first one gives
# ~/worktrees/frame/seconday/frame -> wt/seconday/frame
# Add a sibling line per repo (longest-first) to shorten another repo's worktrees.
'~/worktrees/frame' = 'wt'
'~/worktrees' = 'wt'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'
ignore_branches = ['main', 'master']

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "
region_aliases = { "us-east-1" = "ue1" }

[golang]
format = '[ ](bold cyan)'

[docker_context]
disabled = true

# Show exit code when a command fails
[status]
format = '[$symbol$status]($style)'
symbol = '✗ '

# Long-running command timer
[cmd_duration]
min_time = 1000
format = '[󰔟 $duration]($style)'

# Clock on the right side
[time]
disabled = false
format = '[ $time]($style)'
time_format = '%H:%M'
style = 'subtext0'

# Compact git state: ahead/behind, conflicts, dirty counts
[git_status]
format = '([\[$ahead_behind$conflicted$modified$staged\]]($style))'
style = 'peach'

# Kubernetes context (only renders when a kubeconfig/context exists)
[kubernetes]
disabled = false
# Shorten ugly ARN-style contexts here, e.g.
# context_aliases = { "arn:aws:eks:us-east-1:123:cluster/prod" = "prod" }

