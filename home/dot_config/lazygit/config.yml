# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

os:
  editPreset: "nvim-remote"
  # lazygit sources this before every shell command: the `:` prompt, custom
  # commands, and editor open. zsh expands functions there but not aliases, so
  # this points at a dedicated file instead of ~/.zshrc.
  shellFunctionsFile: ~/.config/zsh/lazygit-functions.zsh
gui:
  scrollHeight: 10
  showFileTree: true
  skipRewordInEditorWarning: true
  showCommandLog: false
  # Rex, Ghostty and Zed's terminal are all on IoskeleyMonoTerm Nerd Font.
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  # Match the --date=iso forced in branchLogCmd / allBranchesLogCmds below.
  timeFormat: "2006-01-02"
  shortTimeFormat: "15:04"
  theme:
    # Solarized Osaka (vivid), matching Neovim: values from the lazygit extra
    # that scripts/gen-themes.lua prints. Exception: the selected line uses
    # base02 (#063540) instead of the extra's blue #1a6397, which washes out
    # branch and file text the same way lazygit's default blue did.
    activeBorderColor:
      - '#fb724a'
      - bold
    inactiveBorderColor:
      - '#664c00'
    searchingActiveBorderColor:
      - '#fb724a'
      - bold
    optionsTextColor:
      - '#5aaefa'
    selectedLineBgColor:
      - '#063540'
    cherryPickedCommitFgColor:
      - '#5aaefa'
    cherryPickedCommitBgColor:
      - '#fe67a8'
    markedBaseCommitFgColor:
      - '#5aaefa'
    markedBaseCommitBgColor:
      - '#dba500'
    unstagedChangesColor:
      - '#ff8c8a'
    defaultFgColor:
      - '#b6c5c6'
    authorColors:
      'Shaked Hagag': cyan
      '*': magenta
    branchColorPatterns:
      '^(task)/': '#5aaefa' # Jira work branches
      '^(bugfix)/': '#ff6c6a' # conventional, changes behaviour
      '^(feature)/': '#a2bb00' # conventional, housekeeping
git:
  mainBranches:
    - main
  # --pretty=medium minus the message body: commit, author, date, subject.
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=iso --pretty="tformat:%C(yellow)commit %h%C(reset)%C(auto)%d%C(reset)%nAuthor: %an <%ae>%nDate:   %ad%n%n    %s%n" {{branchName}} --'
  allBranchesLogCmds:
    - 'git log --all --graph --color=always --abbrev-commit --decorate --date=iso --pretty="tformat:%C(yellow)commit %h%C(reset)%C(auto)%d%C(reset)%nAuthor: %an <%ae>%nDate:   %ad%n%n    %s%n"'
  diffRenderers:
    # These omit --no-gitconfig on purpose, so they inherit [delta] from
    # ~/.gitconfig: dark, navigate, line-numbers, hyperlinks,
    # the Solarized Osaka colors, tabs = 4. Everything below is a lazygit-only
    # override.
    #   --paging=never             lazygit is the pager
    #   --dark                     delta's background auto-detect misfires
    #                              under lazygit; its docs say to set this
    #   --hunk-header-style=omit   lazygit already shows file and position
    #   --hyperlinks-file-link-format  lazygit-edit:// resolves only inside
    #                              lazygit, so gitconfig must not carry it
    - name: delta
      command: 'delta --paging=never --dark --hunk-header-style=omit --file-modified-label="" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"'
  autoFetch: false
  overrideGpg: true
# herdr creates worktrees under ~/worktrees as <repo>/<branch-slug>, set by
# [worktrees].directory in ~/.config/herdr/config.toml. This only supplies the
# candidate parent directory when you create one from lazygit with `w`, which
# skips herdr's workspace registration.
worktree:
  defaultPath: ~/worktrees
update:
  method: never
notARepository: 'quit'
promptToReturnFromSubprocess: false
disableStartupPopups: true
keybinding:
  files:
    toggleStagedAll: <disabled>
customCommands:
  - key: '<c-n>'
    description: 'New branch'
    context: 'localBranches'
    prompts:
      - type: 'menu'
        key: 'Type'
        title: 'Branch type'
        options:
          - name: 'feature'
            description: 'Jira ticket branch (work)'
            value: 'feature'
            key: 'f'
          - name: 'task'
            description: 'Jira ticket branch (work)'
            value: 'task'
            key: 't'
          - name: 'bugfix'
            description: 'Jira ticket branch (work)'
            value: 'bugfix'
            key: 'b'
      - type: 'input'
        key: 'Ticket'
        title: 'Ticket number'
        initialValue: 'frm-'
        condition: '{{ or (eq .Form.Type "feature") (eq .Form.Type "task") (eq .Form.Type "bugfix") }}'
      - type: 'input'
        key: 'Desc'
        title: 'Short description'
        condition: '{{ not (or (eq .Form.Type "feature") (eq .Form.Type "task") (eq .Form.Type "bugfix")) }}'
    command: "git checkout -b \"{{.Form.Type}}/$(printf '%s' '{{.Form.Ticket}}{{.Form.Desc}}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')\" \"{{.SelectedLocalBranch.Name}}\""
    loadingText: 'Creating branch'
  # Headless Claude uses the latest provider-resolved Haiku with low effort.
  # Skip session persistence, skills and MCP startup; keep normal auth/context.
  # No shell fallback: a failed run may already have created some commits.
  - key: '<c-c>'
    command: >-
      GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat
      claude -p --model haiku --effort low --no-session-persistence
      --disable-slash-commands --tools 'Bash,Read'
      --allowedTools 'Read' 'Bash(git *)' --permission-mode dontAsk
      --strict-mcp-config --mcp-config '{"mcpServers":{}}'
      < "${XDG_CONFIG_HOME:-$HOME/.config}/lazygit/prompts/commit.md"
    context: 'files'
    description: 'AI commit with Claude Haiku'
    loadingText: 'Generating commit...'
    output: popup
    outputTitle: 'Claude commit'
  - key: '<c-a>'
    command: >-
      GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true GIT_PAGER=cat
      claude -p --model haiku --effort low --no-session-persistence
      --disable-slash-commands --tools 'Bash,Read'
      --allowedTools 'Read' 'Bash(git *)' --permission-mode dontAsk
      --strict-mcp-config --mcp-config '{"mcpServers":{}}'
      < "${XDG_CONFIG_HOME:-$HOME/.config}/lazygit/prompts/atomic-commit.md"
    context: 'files'
    description: 'AI atomic commits with Claude Haiku'
    loadingText: 'Generating atomic commits...'
    output: popup
    outputTitle: 'Claude atomic commits'
  # This was <c-o>, which is universal.copyToClipboard. Binding it here shadowed
  # copyToClipboard in the two panels that need it, for copyFileInfoToClipboard
  # and copyPullRequestURL. <ctrl+g> is unbound in every default context.
  - key: '<c-g>'
    command: >-
      python3 "${XDG_CONFIG_HOME:-$HOME/.config}/lazygit/scripts/create-pr.py"
      {{if .Form.BodyFile}}--body-file {{.Form.BodyFile | quote}}{{end}}
      --reviewer {{.Form.Reviewer | quote}}
      -- {{.Form.Title | quote}} {{.Form.Description | quote}} {{.Form.Base | quote}}
    context: 'localBranches, files'
    description: 'Create PR with GitHub CLI'
    prompts:
      - type: 'input'
        key: 'Title'
        title: 'Short PR title (branch and package added automatically)'
        initialValue: ''
      - type: 'input'
        key: 'BodyFile'
        title: 'PR body Markdown file (optional, empty = type description)'
        initialValue: ''
        suggestions:
          preset: 'files'
      - type: 'input'
        key: 'Description'
        title: 'PR description (Jira link added automatically)'
        initialValue: ''
        condition: '{{ not .Form.BodyFile }}'
      - type: 'input'
        key: 'Base'
        title: 'Base branch (empty = main)'
        initialValue: ''
        suggestions:
          preset: 'branches'
      - type: 'input'
        key: 'Reviewer'
        title: 'PR reviewer (search repo users, empty = skip)'
        initialValue: ''
        suggestions:
          command: "gh api 'repos/{owner}/{repo}/collaborators?per_page=100' --paginate --jq '.[].login'"
    loadingText: 'Creating pull request...'
    # gh may need to ask where to push an unpublished branch.
    output: terminal
