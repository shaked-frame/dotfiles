# =============================================================================
# kitty configuration
# =============================================================================
# Looks like Rex (app settings, see ~/.config/rex/README.md) and Ghostty
# (~/.config/ghostty/config): same font, line height, padding and colors.
# Where Rex and Ghostty differ (font), Rex wins: it is the daily terminal.
# Reload after editing: ctrl+cmd+, (or restart kitty).

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------
# Rex: Geist Mono 14.5 with ligatures (=> !== ->), line height +20% (kitty: a
# bare percentage is relative to the normal height, so +20% is 120%).
font_family      family="Geist Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14
modify_font      cell_height 120%
# Nerd Font icons from Geist's Nerd Font build ("GeistMono Nerd Font Mono", as in
# Rex's fallback list). kitty finds it by PostScript name, unquoted.
# kitty draws box-drawing characters itself, so borders line up without it.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD GeistMonoNFM

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
# Rex: bar cursor. No trail (Rex's cursor shader is off).
cursor_shape          beam
cursor_trail          0

# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------
# Rex: 16 px left/right, 8 px top/bottom, padding painted with the background.
window_padding_width  8 8
background_opacity    0.8
background_blur       20
# Ghostty `macos-titlebar-style = hidden`: no titlebar or window buttons, but
# keep the native frame and rounded corners.
hide_window_decorations titlebar-only
# Ghostty `unfocused-split-opacity = 0.8`.
inactive_text_alpha   0.8
focus_follows_mouse   yes

# -----------------------------------------------------------------------------
# Tabs
# -----------------------------------------------------------------------------
tab_bar_edge          top
tab_bar_style         separator
tab_separator         " "
tab_title_template    " {index}: {title} "
tab_bar_margin_height 4 4

# -----------------------------------------------------------------------------
# macOS
# -----------------------------------------------------------------------------
macos_option_as_alt          yes
macos_traditional_fullscreen yes
macos_show_window_title_in   none

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# The Ghostty/Rex colors in kitty syntax, generated by scripts/gen-themes.lua.
include themes/solarized-osaka-vivid.conf

# -----------------------------------------------------------------------------
# Keys
# -----------------------------------------------------------------------------
# Line start/end like a macOS text field (Ghostty and Rex do the same).
map cmd+left  send_text all \x1b[H
map cmd+right send_text all \x1b[F

# Hyper (cmd+ctrl+alt+shift, the ZSA Voyager key) -> raw CSI-u with modifier
# 15, for Neovim's `H()` maps, whether or not the app negotiated kitty's
# keyboard protocol. Same bytes as Ghostty's keybinds and Rex's `send()`.
# - Hyper+6/7/8/9 -> window resize; Hyper+0 -> resize too (Ghostty parity)
# - Hyper+\ -> next diagnostic; Hyper+p -> next hunk
map cmd+ctrl+alt+shift+6         send_text all \x1b[54;15u
map cmd+ctrl+alt+shift+7         send_text all \x1b[55;15u
map cmd+ctrl+alt+shift+8         send_text all \x1b[56;15u
map cmd+ctrl+alt+shift+9         send_text all \x1b[57;15u
map cmd+ctrl+alt+shift+0         send_text all \x1b[48;15u
map cmd+ctrl+alt+shift+backslash send_text all \x1b[92;15u
map cmd+ctrl+alt+shift+p         send_text all \x1b[112;15u
