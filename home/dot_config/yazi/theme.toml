[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#dba500" },

	# Media
	{ mime = "{audio,video}/*", fg = "#fe67a8" },

	# Archives
	{ mime = "application/*zip", fg = "#ff6c6a" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ff6c6a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#34c5b9" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#ff6c6a" },

	# Special files
	{ url = "*", is = "orphan", bg = "#ff6c6a" },
	{ url = "*", is = "exec"  , fg = "#a2bb00" },

	# Fallback
	{ url = "*/", fg = "#5aaefa" }
]
    