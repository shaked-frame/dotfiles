# Secret scan of the full history on every push and PR. Backs up the local
# pre-commit hook, which is skipped in a clone without `core.hooksPath` or by
# `--no-verify`. Runs the gitleaks CLI directly: gitleaks-action needs a paid
# license on organization repos.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version Homebrew installs locally.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 3 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks git --redact --no-banner --verbose --platform github .
