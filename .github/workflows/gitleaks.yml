# Secret scan of the full history on every push and PR. Backs up the local
# pre-commit hook, which is skipped in a clone without `core.hooksPath` or by
# `--no-verify`. Runs the gitleaks CLI directly: gitleaks-action needs a paid
# license on organization repos.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version Homebrew installs locally.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Through the API with `gh`: the plain releases/download URL has been
      # returning 504 for this asset. Checked against the release checksums.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks \
            -p "$tarball" -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          gitleaks version
      - name: Scan history
        run: gitleaks git --redact --no-banner --verbose --platform github .
