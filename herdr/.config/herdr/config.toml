# herdr configuration
# Docs: https://herdr.dev/docs/config-reference/
# Reload after editing: herdr server reload-config  (or prefix+shift+r)

onboarding = false

[theme]
# Matches the Neovim colour scheme (onedark.nvim, style = 'dark').
# Built-in themes: catppuccin, catppuccin-latte, terminal, tokyo-night,
# tokyo-night-day, dracula, nord, gruvbox, gruvbox-light, one-dark, one-light,
# solarized, solarized-light, kanagawa, kanagawa-lotus, rose-pine,
# rose-pine-dawn, vesper.
name = "one-dark"

# Set to true to follow the host terminal's light/dark appearance. Herdr would
# pick the `one-light` sibling automatically, but it can be named explicitly:
#   light_name = "one-light"
#   dark_name = "one-dark"
auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"  # new panes/tabs inherit the current working directory

#------------------------------------------
# Key Mappings (tmux-style)
#------------------------------------------
[keys]
prefix = "f12"

# Panes: vim navigation, tmux-style splits
# Panes: vim navigation, tmux-style splits
# Each action takes a list: the prefix binding plus a direct chord that needs no
# prefix. `ctrl+alt` is the one modifier family herdr's docs found essentially
# unclaimed across terminals and desktops, and it is not affected by the macOS
# option-key composing that blocks plain `alt` chords.
# These replace Ghostty `text:\x01h` keybinds, which injected the raw prefix byte.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

split_horizontal = ["prefix+-", "ctrl+alt+shift+d"]  # stacked split
split_vertical = ["prefix+|", "ctrl+alt+d"]          # side-by-side split
close_pane = "prefix+x"
zoom = ["prefix+z", "ctrl+alt+z"]
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"
last_pane = "prefix+a"                   # like `bind a last-window`
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Tabs (tmux windows)
new_tab = ["prefix+c", "ctrl+alt+c"]
next_tab = ["prefix+n", "ctrl+alt+]"]
previous_tab = ["prefix+p", "ctrl+alt+["]
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
switch_tab = "prefix+1..9"

# Worktrees (a worktree-backed workspace ~= a Zed window per worktree)
# new_worktree defaults to prefix+shift+g, so it is not repeated here.
open_worktree = "prefix+shift+o"        # pick an existing worktree to open
# remove_worktree is deliberately left unbound: it deletes a checkout.
# Use `herdr worktree remove` when that is actually intended.

# Workspaces (tmux sessions)
# Worktree-backed workspaces ~= Zed window per worktree. F12 thumb key = prefix.
# ctrl+alt+* are direct, no prefix needed.
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = ["prefix+w", "ctrl+alt+w"]
switch_workspace = "prefix+shift+1..9"
previous_workspace = ["prefix+alt+p", "ctrl+alt+p"]
next_workspace = ["prefix+alt+n", "ctrl+alt+n"]
previous_agent = "ctrl+alt+i"
next_agent = "ctrl+alt+o"
focus_agent = "ctrl+alt+1..9"

# Misc
help = "prefix+?"
settings = "prefix+comma"
detach = "prefix+d"
reload_config = "prefix+shift+r"
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]
goto = ["prefix+g", "ctrl+alt+g"]
edit_scrollback = "prefix+e"

# Navigate mode: vim keys
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# vim-herdr-navigation: seamless ctrl+h/j/k/l across herdr panes and Vim splits.
# The plugin action forwards the key into Vim when the focused pane runs
# Vim/Neovim, otherwise it moves herdr pane focus. Editor side is wired in
# nvim/after/plugin/herdr-navigation.lua. Requires `jq` for Vim detection.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# lazygit popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

# scratch terminal popup
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

# Toggle the coding agent pane in the current tab (zoom it fullscreen, or
# back to the split) regardless of which pane currently has focus. Resolves
# "the agent" dynamically via `herdr agent list`, scoped to this workspace
# and tab, so it works without hardcoding a pane ID. Requires `jq`.
# NOTE: avoid `alt+<letter>` here - Raycast (and similar launchers) tend to
# register those as OS-level global hotkeys, which intercept the keypress
# before it ever reaches the terminal, regardless of Herdr's prefix state.
[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr pane zoom --toggle --pane \"$(herdr agent list | jq -r --arg ws \"$HERDR_ACTIVE_WORKSPACE_ID\" --arg tab \"$HERDR_ACTIVE_TAB_ID\" '[.result.agents[] | select(.workspace_id==$ws and .tab_id==$tab and .agent!=\"opencode\" and .display_agent!=\"opencode\")][0].pane_id // empty')\""
description = "Toggle agent pane (zoom)"

# Toggle between the "Terminal" tab and the "Vim" tab in the current
# workspace: from anywhere -> Terminal, from Terminal -> back to Vim.
# Prefix match covers "Term" (main) and "Terminal" (secondary/third).
# Requires `jq`. NOTE: `cmd` chords need the outer terminal to deliver them;
# if Ghostty/macOS eats `cmd+j`, free it there or pick another chord.
[[keys.command]]
key = "cmd+j"
type = "shell"
command = "TARGET=\"$(herdr tab list --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" | jq -r --arg t \"$HERDR_ACTIVE_TAB_ID\" '(.result.tabs | map(select(.tab_id==$t))[0].label // \"\") as $cur | if ($cur | ascii_downcase | startswith(\"term\")) then ([.result.tabs[] | select(.label // \"\" | ascii_downcase | startswith(\"vim\"))][0].tab_id // empty) else ([.result.tabs[] | select(.label // \"\" | ascii_downcase | startswith(\"term\"))][0].tab_id // empty) end')\"; [ -n \"$TARGET\" ] && herdr tab focus \"$TARGET\""
description = "Toggle Terminal/Vim tab"

# Move the workspace's agent pane between the Claude tab and a Vim-tab split
# (toggle): Claude tab -> split right in Vim; Vim split -> back to Claude tab
# (recreated if it closed when its last pane left). Moving preserves the live
# agent process - closing the pane and reopening would kill its session.
# Requires `jq`.
[[keys.command]]
key = ["prefix+shift+v", "ctrl+alt+v"]
type = "shell"
command = "WS=\"$HERDR_ACTIVE_WORKSPACE_ID\"; TABS=\"$(herdr tab list --workspace \"$WS\")\"; AT=\"$(herdr agent list | jq -r --arg ws \"$WS\" '[.result.agents[] | select(.workspace_id==$ws and .agent!=\"opencode\" and .display_agent!=\"opencode\")][0] | [.pane_id, .tab_id] | @tsv')\"; PANE=\"$(printf %s \"$AT\" | cut -f1)\"; ATAB=\"$(printf %s \"$AT\" | cut -f2)\"; VIM=\"$(printf %s \"$TABS\" | jq -r '[.result.tabs[] | select(.label==\"Vim\")][0].tab_id // empty')\"; CLAUDE=\"$(printf %s \"$TABS\" | jq -r '[.result.tabs[] | select(.label==\"Claude\")][0].tab_id // empty')\"; if [ -z \"$PANE\" ]; then exit 0; fi; if [ \"$ATAB\" = \"$VIM\" ]; then if [ -n \"$CLAUDE\" ]; then herdr pane move \"$PANE\" --tab \"$CLAUDE\" --split right --focus; else herdr pane move \"$PANE\" --new-tab --workspace \"$WS\" --label \"Claude\" --focus; fi; else if [ -n \"$VIM\" ]; then herdr pane move \"$PANE\" --tab \"$VIM\" --split right --focus; fi; fi"
description = "Move agent pane Claude-tab <-> Vim split"

# Minimize the agent pane (toggle): zooms the first non-agent pane of the
# current tab fullscreen, so the agent is invisible but keeps running.
# Press again to restore the split layout. (A herdr-level `cmd+r` would
# swallow nvim's `<D-r>` Focus-agent/hide-chat, so this uses `m` instead.)
[[keys.command]]
key = ["prefix+shift+m", "ctrl+alt+m", "shift+esc"]
type = "shell"
command = "PANE=\"$(herdr pane list --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" | jq -r --arg tab \"$HERDR_ACTIVE_TAB_ID\" '[.result.panes[] | select(.tab_id==$tab and (has(\"agent\") | not))][0].pane_id // empty')\"; [ -n \"$PANE\" ] && herdr pane zoom --toggle --pane \"$PANE\""
description = "Minimize agent pane (zoom editor)"

#------------------------------------------
# UI
#------------------------------------------
[ui]
# Muted to match Neovim's separator gray (onedark `FloatBorder`/`LineNr`).
# NOTE: this is the only border-brightness knob Herdr exposes, and it also
# drives the other accent UI (navigation highlights, tab markers, agent
# labels on borders) - they all go subtle together. Revert to "#61afef"
# to get the bright blue back.
accent = "#5c6370"
# Interior dividers only: shared-edge splitters with no outside frame
# (tmux-style). `auto` skips the frame on a lone pane while
# `pane_outer_borders = false` drops the outer edge; gaps stay off so
# neighbors share one divider line instead of two separated borders.
pane_borders = "auto"
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
confirm_close = true
copy_on_select = true
mouse_capture = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[experimental]
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true

#------------------------------------------
# Worktrees
#------------------------------------------
# Root directory for worktrees Herdr creates, as <repo>/<branch-slug>.
# Default is "~/.herdr/worktrees"; this matches the existing ~/worktrees habit.
# After creating/opening, bootstrap with `worktree-setup` (pnpm install) and
# `link-worktree-zed` (.zed settings link) from
# `zsh/.config/zsh/lazygit-functions.zsh`. Full flow: `docs/worktree-flow.md`.
#
# NOTE: pre-existing worktrees under ~/frame/.worktrees/ are unaffected - this
# only decides where NEW ones land. `herdr worktree list` still finds all of
# them, since it reads `git worktree list` rather than scanning this directory.
[worktrees]
directory = "~/worktrees"
