# herdr configuration
# Docs: https://herdr.dev/docs/config-reference/
# Reload after editing: herdr server reload-config  (or prefix+shift+r)

onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"  # new panes/tabs inherit the current working directory

#------------------------------------------
# Key Mappings (tmux-style)
#------------------------------------------
[keys]
prefix = "ctrl+a"

# Panes: vim navigation, tmux-style splits
# Panes: vim navigation, tmux-style splits
# Each action takes a list: the prefix binding plus a direct chord that needs no
# prefix. `ctrl+alt` is the one modifier family herdr's docs found essentially
# unclaimed across terminals and desktops, and it is not affected by the macOS
# option-key composing that blocks plain `alt` chords.
# These replace Ghostty `text:\x01h` keybinds, which injected the raw prefix byte.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

split_horizontal = "prefix+-"            # stacked split
split_vertical = "prefix+|"              # side-by-side split
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"
last_pane = "prefix+a"                   # like `bind a last-window`
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Tabs (tmux windows)
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
switch_tab = "prefix+1..9"

# Worktrees (a worktree-backed workspace ~= a Zed window per worktree)
# new_worktree defaults to prefix+shift+g, so it is not repeated here.
open_worktree = "prefix+shift+o"        # pick an existing worktree to open
# remove_worktree is deliberately left unbound: it deletes a checkout.
# Use `herdr worktree remove` when that is actually intended.

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+alt+p"
next_workspace = "prefix+alt+n"

# Misc
help = "prefix+?"
settings = "prefix+comma"
detach = "prefix+d"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
goto = "prefix+g"
edit_scrollback = "prefix+e"

# Navigate mode: vim keys
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# lazygit popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

# scratch terminal popup
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

#------------------------------------------
# UI
#------------------------------------------
[ui]
accent = "#cba6f7"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
confirm_close = true
copy_on_select = true
mouse_capture = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = false

[experimental]
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true

#------------------------------------------
# Worktrees
#------------------------------------------
# Root directory for worktrees Herdr creates, as <repo>/<branch-slug>.
# Default is "~/.herdr/worktrees"; this matches the existing ~/worktrees habit
# (and the `worktree` shell function in .zshrc).
#
# NOTE: pre-existing worktrees under ~/frame/.worktrees/ are unaffected - this
# only decides where NEW ones land. `herdr worktree list` still finds all of
# them, since it reads `git worktree list` rather than scanning this directory.
[worktrees]
directory = "~/worktrees"
